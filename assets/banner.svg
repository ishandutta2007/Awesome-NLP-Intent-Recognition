<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pill-subtext {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #38bdf8;
    }

    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulse-orb {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .floating-pill-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: floatPill2 6s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8 16;
      animation: dashMove 12s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 6 12;
      animation: dashMove 9s linear infinite reverse;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Decorative Orbs / Glows (strictly background layer) -->
  <g class="pulse-orb" opacity="0.4">
    <circle cx="180" cy="80" r="140" fill="#0284c7" filter="url(#glow)" />
    <circle cx="1020" cy="270" r="160" fill="#7c3aed" filter="url(#glow)" />
    <circle cx="600" cy="180" r="120" fill="#4f46e5" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Network / Grid Architecture Lines (Background dynamic flow) -->
  <g opacity="0.35">
    <path d="M 50 180 Q 300 60, 600 180 T 1150 180" fill="none" stroke="url(#flowLineGrad)" stroke-width="2" class="stream-line" />
    <path d="M 80 240 Q 350 320, 650 200 T 1120 120" fill="none" stroke="url(#flowLineGrad)" stroke-width="1.5" class="stream-line-rev" />
    <path d="M 120 90 Q 400 10, 750 110 T 1100 280" fill="none" stroke="url(#primaryGrad)" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Dynamic Floating Intent Badges / Interactive Nodes (Side accents) -->
  <!-- Left dynamic card -->
  <g class="floating-pill-1" transform="translate(60, 60)">
    <rect width="190" height="48" rx="24" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" filter="url(#softGlow)" />
    <circle cx="24" cy="24" r="7" fill="#38bdf8" />
    <text x="42" y="22" class="badge-text">Intent: BookFlight</text>
    <text x="42" y="36" class="pill-subtext">Confidence: 99.4%</text>
  </g>

  <g class="floating-pill-2" transform="translate(70, 240)">
    <rect width="180" height="46" rx="23" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" opacity="0.85" />
    <circle cx="22" cy="23" r="6" fill="#818cf8" />
    <text x="38" y="21" class="badge-text">Slot: Destination</text>
    <text x="38" y="34" class="pill-subtext">Entity: "San Francisco"</text>
  </g>

  <!-- Right dynamic cards -->
  <g class="floating-pill-2" transform="translate(940, 65)">
    <rect width="195" height="48" rx="24" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" opacity="0.85" filter="url(#softGlow)" />
    <circle cx="24" cy="24" r="7" fill="#c084fc" />
    <text x="42" y="22" class="badge-text">Intent: CheckBalance</text>
    <text x="42" y="36" class="pill-subtext">NLU: Zero-Shot</text>
  </g>

  <g class="floating-pill-1" transform="translate(930, 240)">
    <rect width="205" height="46" rx="23" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" />
    <circle cx="22" cy="23" r="6" fill="#38bdf8" />
    <text x="38" y="21" class="badge-text">Pipeline: Transformer</text>
    <text x="38" y="34" class="pill-subtext">Latency: 12ms</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp, High-Contrast, Foreground Secured) -->
  <g id="foreground-content">
    <!-- Category Tag -->
    <g transform="translate(450, 48)">
      <rect width="300" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text x="150" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#a5b4fc" letter-spacing="1.5">CONVERSATIONAL AI &amp; NLU</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="130" text-anchor="middle" class="title-text" fill="url(#primaryGrad)" filter="url(#softGlow)">
      Awesome NLP Intent Recognition
    </text>

    <!-- High-contrast crisp overlay for readability -->
    <text x="600" y="130" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.95">
      Awesome NLP Intent Recognition
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="172" text-anchor="middle" class="subtitle-text" font-size="18" fill="#e2e8f0" font-weight="600">
      Curated Landscape of Conversational Understanding, Intent Classification &amp; Slot Filling
    </text>

    <!-- Subtitle Line 2 -->
    <text x="600" y="202" text-anchor="middle" class="subtitle-text">
      Enterprise SaaS Platforms &#8226; Open-Source Transformer &amp; NLU Toolkits &#8226; Production Benchmarks
    </text>

    <!-- Pill Feature Highlights -->
    <g transform="translate(290, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">&#x2728; 10+ SaaS Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(210, 0)">
        <rect width="200" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="100" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#818cf8">&#x1F916; 30+ Open-Source Libs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(440, 0)">
        <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c084fc">&#x1F4CA; Market Dynamics</text>
      </g>
    </g>

    <!-- Bottom metadata info -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Maintained by @ishandutta2007 &#8226; Updated Weekly &#8226; Community Contributions Welcome
    </text>
  </g>
</svg>
